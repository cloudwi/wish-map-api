spring:
  application:
    name: wish-map-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    enabled: true
  webmvc:
    problemdetails:
      enabled: true

# JWT 설정
jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 1800000  # 30분 (ms)
  refresh-token-expiration: 604800000  # 7일 (ms)

# Naver Search API
naver:
  search:
    client-id: ${NAVER_SEARCH_CLIENT_ID:}
    client-secret: ${NAVER_SEARCH_CLIENT_SECRET:}

sms:
  max-daily-sends: ${SMS_MAX_DAILY_SENDS:20}
  solapi:
    api-key: ${SOLAPI_API_KEY:}
    api-secret: ${SOLAPI_API_SECRET:}
    sender: ${SOLAPI_SENDER:}
