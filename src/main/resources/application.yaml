spring:
  application:
    name: wish-map-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  flyway:
    enabled: true
  webmvc:
    problemdetails:
      enabled: true

# JWT 설정
jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 1800000  # 30분 (ms)
  refresh-token-expiration: 604800000  # 7일 (ms)

# Naver Search API
naver:
  search:
    client-id: ${NAVER_SEARCH_CLIENT_ID:}
    client-secret: ${NAVER_SEARCH_CLIENT_SECRET:}

# OAuth 설정 (공개 값 - 토큰 audience 검증용)
# Google Sign-In은 iOS/Android/Web 각각 다른 client ID를 발급하므로
# GOOGLE_ALLOWED_AUDIENCES (콤마 구분)로 허용 목록 추가 가능.
oauth:
  google:
    client-id: 386596705781-6tep6l6v4ftslcrcbdipakl72d26k750.apps.googleusercontent.com
    allowed-audiences: ${GOOGLE_ALLOWED_AUDIENCES:386596705781-mp70rdrp1ulj6dovlqs0doig1t56592r.apps.googleusercontent.com}
  apple:
    client-id: com.wishmap.app
